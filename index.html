<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statistiche attese</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f7;--bg2:#e3e9f2;--card:#ffffff;--card2:#f6f8fb;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;
  --acc:#2563eb;--acc2:#16a34a;--casa:#2563eb;--osp:#f59e0b;--su:#16a34a;--giu:#dc2626;
  --heat0:#e0e7ff;--heat1:#2563eb;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 16px rgba(15,23,42,.06);
  --glow1:rgba(37,99,235,.12);--glow2:rgba(22,163,74,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#070b14;--bg2:#0c1322;--card:rgba(255,255,255,.045);--card2:rgba(255,255,255,.07);--ink:#e8edf5;--mute:#8b98ad;
  --line:rgba(255,255,255,.08);--acc:#60a5fa;--acc2:#4ade80;--casa:#60a5fa;--osp:#fbbf24;--su:#4ade80;--giu:#f87171;
  --heat0:rgba(96,165,250,.12);--heat1:#3b82f6;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --glow1:rgba(59,130,246,.18);--glow2:rgba(34,197,94,.12);
}}
*{box-sizing:border-box}
html,body{margin:0}
body{color:var(--ink);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  background:radial-gradient(900px 500px at 10% -10%,var(--glow1),transparent 60%),
             radial-gradient(800px 500px at 100% 0%,var(--glow2),transparent 60%),
             linear-gradient(180deg,var(--bg2),var(--bg) 420px);background-color:var(--bg);min-height:100vh}
.num,.big{font-family:"Barlow Condensed",Inter,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.wrap{max-width:920px;margin:0 auto;padding:0 16px 56px}
#topbar{padding:18px 0 4px}
header{position:sticky;top:0;z-index:20;margin:0 -16px;padding:8px 16px 10px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
h1 i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--acc2);box-shadow:0 0 12px var(--acc2)}
.sub{color:var(--mute);font-size:12px;margin-top:2px}
.search{flex:1;min-width:180px;max-width:280px;position:relative}
.search input{width:100%;font:inherit;font-size:14px;padding:8px 12px 8px 32px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);outline:none}
.search input:focus{border-color:var(--acc)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);opacity:.5}
.tabs{display:flex;gap:4px;margin-top:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar,.chips::-webkit-scrollbar{display:none}
.tabs button{font:inherit;font-size:14px;font-weight:600;border:0;background:none;color:var(--mute);padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card2);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:8px;padding-bottom:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font:inherit;font-size:13px;font-weight:500;white-space:nowrap;border:1px solid var(--line);
  background:var(--card);color:var(--ink);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip img{width:16px;height:16px;object-fit:contain}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.stat.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
main{padding-top:16px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:18px 2px 10px}
.sec h2{font-size:15px;margin:0;font-weight:700}
.sec span{color:var(--mute);font-size:12px}
.riep{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:120px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px}.kpi span{color:var(--mute);font-size:12px}
.grid{display:grid;gap:10px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;transition:transform .12s,border-color .12s}
.mc:hover{transform:translateY(-1px);border-color:color-mix(in srgb,var(--acc) 40%,var(--line))}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:12px;margin-bottom:8px}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;background:var(--card2);color:var(--ink)}
.badge.fin{background:var(--ink);color:var(--bg)}
.badge.lg{display:inline-flex;align-items:center;gap:4px}
.badge.lg img{width:12px;height:12px}
.body{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.teams{display:grid;gap:6px;min-width:0}
.team{display:grid;grid-template-columns:24px 1fr auto;gap:8px;align-items:center}
.team .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .v{font-size:19px;font-weight:700}
.logo{width:24px;height:24px;object-fit:contain}
.ini{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--card2);color:var(--mute)}
.tot{min-width:72px;text-align:center;border-radius:12px;padding:8px 6px}
.tot .big{font-size:28px;font-weight:700;line-height:1}
.tot small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.8;margin-top:2px}
.split{display:flex;height:6px;border-radius:999px;overflow:hidden;margin-top:10px;background:var(--card2)}
.split i{display:block;height:100%}
.split .c{background:var(--casa)}.split .o{background:var(--osp)}
.cmp{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12px;color:var(--mute)}
.track{position:relative;height:8px;border-radius:999px;background:var(--card2)}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;opacity:.85}
.track .mark{position:absolute;top:-4px;width:2px;height:16px;background:var(--ink);border-radius:2px}
.d{font-weight:700;font-size:13px}.d.su{color:var(--su)}.d.giu{color:var(--giu)}
.wait{margin-top:10px;font-size:12px;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ord{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0 12px;color:var(--mute);font-size:13px}
.ord select,.ord button{font:inherit;font-size:13px;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:0}
th{color:var(--mute);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;cursor:pointer;user-select:none;background:var(--card2)}
th.sel{color:var(--acc)}
td.rk{color:var(--mute);width:28px;text-align:right}
td.nm{text-align:left;font-weight:600;position:sticky;left:0;background:var(--card)}
@media (prefers-color-scheme:dark){td.nm{background:#0f1726}}
td.nm span{display:inline-flex;align-items:center;gap:8px}
td.nm img,td.nm .ini{width:18px;height:18px}
td .num{font-size:16px}
td.hl{font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--mute)}
.note{color:var(--mute);font-size:12px;margin:12px 4px}
.ovl{position:fixed;inset:0;background:rgba(2,6,23,.55);backdrop-filter:blur(3px);z-index:50;display:none;align-items:flex-end;justify-content:center}
.ovl.on{display:flex}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;border:1px solid var(--line);box-shadow:0 -10px 40px rgba(0,0,0,.35);padding:16px 16px 24px}
@media (min-width:760px){.ovl{align-items:center}.sheet{border-radius:18px}}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{font:inherit;border:0;background:var(--card2);color:var(--ink);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;flex:none}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center;margin:14px 0 6px}
.vs .t img,.vs .t .ini{width:44px;height:44px;margin:0 auto 6px;display:block}
.vs .t .ini{display:grid;font-size:14px}
.vs .t b{display:block;font-size:15px}
.vs .score{font-size:34px;font-weight:700}
.sheet h3{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px}
.sheet table td:first-child,.sheet table th:first-child{text-align:left}
.sheet .grp{border-left:1px solid var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;margin:12px 2px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media (max-width:520px){.team .v{font-size:17px}.tot{min-width:62px}.tot .big{font-size:24px}h1{font-size:18px}}

    ${diff&&r?`<div class="tot" style="${col(Math.abs(r.att_casa-r.att_osp))}"><div class="big">${f1(Math.abs(r.att_casa-r.att_osp))}</div><small>differenza</small></div>`:
    `<div class="tot" style="${r?col(r.totale):""}"><div class="big">${r?f1(r.totale):"–"}</div><small>${esc(NOME[S.tipo])}</small></div>`}</div>`;
  if(r){const tc=r.att_casa+r.att_osp||1;h+=`<div class="split"><i class="c" style="width:${100*r.att_casa/tc}%"></i><i class="o" style="width:${100*r.att_osp/tc}%"></i></div>`}
  if(r&&re){const mx=Math.max(r.totale,re.tot)*1.15||1,d=re.tot-r.totale;
    h+=`<div class="cmp"><span>Reale <b class="num" style="font-size:16px;color:var(--ink)">${re.tot}</b> <span>(${re.casa}–${re.osp})</span></span>
      <div class="track"><div class="fill" style="width:${100*re.tot/mx}%;background:${d>=0?"var(--su)":"var(--giu)"}"></div><div class="mark" style="left:${100*r.totale/mx}%" title="atteso"></div></div>
      <span class="d ${d>=0?"su":"giu"}">${d>=0?"+":""}${f(d)}</span></div>`}
  else if(p.giocata)h+=`<div class="wait">Dati reali in arrivo (1-3 giorni dopo la partita)</div>`;
  return h+`</div>`;
}
const MODO_EV={totali:"entrambi",porta:"entrambi",corner:"differenza",corner1t:"differenza"};
function vEvidenza(){
  let tutte=[];D.leghe.forEach((L,li)=>{const B=bloccoDi(L);if(B&&ammessi(L).includes(S.tipo))B.partite.forEach((p,pi)=>{if(p[S.tipo]&&!giaPassata(p))tutte.push([L,p,li,pi])})});
  if(!tutte.length){D.leghe.forEach((L,li)=>{const B=bloccoDi(L);if(B&&ammessi(L).includes(S.tipo))B.partite.forEach((p,pi)=>{if(p[S.tipo])tutte.push([L,p,li,pi])})})}
  if(!tutte.length)return `<div class="empty">Nessuna partita disponibile</div>`;
  const modo=MODO_EV[S.tipo]||"totale",nome=esc(NOME[S.tipo]);
  const g=(arr,diff)=>`<div class="grid">${arr.map(([L,p,li,pi])=>card(L,p,li,pi,true,diff)).join("")}</div>`;
  let h="";
  if(modo!="differenza"){
    const t=[...tutte].sort((a,b)=>b[1][S.tipo].totale-a[1][S.tipo].totale);
    card.col=scala(t.map(x=>x[1][S.tipo].totale));
    h+=`<div class="sec"><h2>${nome}: totali attesi più alti</h2><span>tutti i campionati · partite da giocare</span></div>${g(t.slice(0,6),false)}
      <div class="sec"><h2>${nome}: totali attesi più bassi</h2><span>tutti i campionati</span></div>${g(t.slice(-6).reverse(),false)}`}
  if(modo!="totale"){
    const dif=x=>Math.abs(x[1][S.tipo].att_casa-x[1][S.tipo].att_osp);
    const d=[...tutte].sort((a,b)=>dif(b)-dif(a));
    card.col=scala(d.map(dif));
    h+=`<div class="sec"><h2>${nome}: differenze più alte tra le squadre</h2><span>attesi casa contro attesi ospite · tutti i campionati</span></div>${g(d.slice(0,modo=="differenza"?12:6),true)}`}
  return h;
}
function vPartite(){
  if(S.q){const q=S.q.toLowerCase();let res=[];
    D.leghe.forEach((L,li)=>{const B=bloccoDi(L);if(B&&ammessi(L).includes(S.tipo))B.partite.forEach((p,pi)=>{if((p.casa+" "+p.osp).toLowerCase().includes(q))res.push([L,p,li,pi])})});
    card.col=scala(res.map(x=>x[1][S.tipo]&&x[1][S.tipo].totale));
    return `<div class="sec"><h2>Risultati per “${esc(S.q)}”</h2><span>${res.length} partite</span></div>`+
      (res.length?`<div class="grid">${res.map(([L,p,li,pi])=>card(L,p,li,pi,true)).join("")}</div>`:`<div class="empty">Nessuna partita trovata</div>`)}
  const L=D.leghe[S.lega],B=bloccoDi(L);
  if(!B||!B.partite.length)return `<div class="empty">Nessuna partita in programma per ${esc(L.nome)} nei prossimi giorni</div>`;
  card.col=scala(B.partite.map(p=>p[S.tipo]&&p[S.tipo].totale));
  const gi=B.partite.filter(p=>p.reale&&p.reale[S.tipo]&&p[S.tipo]);
  let riep="";
  if(gi.length){const e=gi.map(p=>p.reale[S.tipo].tot-p[S.tipo].totale),em=e.reduce((a,b)=>a+Math.abs(b),0)/e.length,su=e.filter(x=>x>0).length;
    riep=`<div class="riep"><div class="kpi"><b class="num">${gi.length}</b><span>partite con dati reali</span></div>
      <div class="kpi"><b class="num">${f(em)}</b><span>scarto medio dall'atteso</span></div>
      <div class="kpi"><b class="num"><span style="color:var(--su)">${su}</span> / <span style="color:var(--giu)">${gi.length-su}</span></b><span>reale sopra / sotto l'atteso</span></div></div>`}
  return `<div class="sec"><h2>${esc(L.nome)} · ${esc(B.titolo)}</h2><span>${esc(NOME[S.tipo])} attesi</span></div>${riep}
    <div class="grid">${B.partite.map((p,pi)=>card(L,p,S.lega,pi,false)).join("")}</div>
    <div class="legend"><span><i style="background:var(--casa)"></i>casa</span><span><i style="background:var(--osp)"></i>ospite</span><span>tocca una partita per la tabella completa</span></div>`;
}
function tabella(cols,righe,o,nomeCol,L){
  righe.sort((a,b)=>((a[o.k]??-1e9)-(b[o.k]??-1e9))*o.d);
  const col=scala(righe.map(r=>r[o.k]));
  let h=`<div class="card scroll"><table><tr><th></th><th style="text-align:left">${nomeCol}</th>${cols.map(([k,l])=>`<th data-k="${k}" class="${k==o.k?"sel":""}">${l}${k==o.k?(o.d<0?" ↓":" ↑"):""}</th>`).join("")}</tr>`;
  righe.forEach((r,i)=>{h+=`<tr><td class="rk">${i+1}</td><td class="nm"><span>${L?logo(L,r.nome):""}${esc(r.nome)}</span></td>${cols.map(([k])=>
    k=="n"||k.startsWith("n_")?`<td>${r[k]}</td>`:`<td class="${k==o.k?"hl":""}" ${k==o.k?`style="${col(r[k])}"`:""}><span class="num">${f(r[k])}</span></td>`).join("")}</tr>`});
  return h+`</table></div>`;
}
function ordUI(cols,o){return `<div class="ord">Ordina per <select id="ordk">${cols.map(([k,l])=>`<option value="${k}" ${k==o.k?"selected":""}>${l}</option>`).join("")}</select>
  <button id="ordd">${o.d<0?"Dal più alto ↓":"Dal più basso ↑"}</button></div>`}
function vSquadre(){
  const L=D.leghe[S.lega],[fa,su]=PAROLE[S.tipo],F=fa[0].toUpperCase()+fa.slice(1),Su=su[0].toUpperCase()+su.slice(1);
  const cols=[["tot_fatti",`${F} (tutte)`],["tot_subiti",`${Su} (tutte)`],["casa_fatti",`${F} casa`],["casa_subiti",`${Su} casa`],["trasf_fatti",`${F} trasf.`],["trasf_subiti",`${Su} trasf.`],["n_casa","Gare casa"],["n_trasf","Gare trasf."]];
  const q=S.q.toLowerCase();
  const righe=Object.entries(L.squadre).filter(([n,v])=>v[S.tipo]&&(!q||n.toLowerCase().includes(q))).map(([n,v])=>({nome:n,...v[S.tipo]}));
  return `<div class="sec"><h2>${esc(L.nome)} · classifica squadre</h2><span>${esc(NOME[S.tipo])} · media a partita</span></div>`+ordUI(cols.filter(c=>!c[0].startsWith("n_")),S.ordS)+
    (righe.length?tabella(cols,righe,S.ordS,"Squadra",L):`<div class="empty">Nessun dato</div>`)+`<div class="note">“tutte” = media su tutte le partite, in casa e in trasferta · tocca un'intestazione per ordinare</div>`;
}
function vArbitri(){
  const L=D.leghe[S.lega],cols=[["falli","Falli a partita"],["cart","Cartellini a partita"],["n","Partite"]];
  const q=S.q.toLowerCase(),righe=(L.arbitri||[]).filter(a=>!q||a.nome.toLowerCase().includes(q)).map(a=>({...a}));
  return `<div class="sec"><h2>${esc(L.nome)} · arbitri</h2><span>falli e cartellini totali a partita diretta</span></div>`+
    (righe.length?ordUI(cols,S.ordA)+tabella(cols,righe,S.ordA,"Arbitro",null)+`<div class="note">Attenzione agli arbitri con poche partite: la media conta poco</div>`:`<div class="empty">Nessun dato arbitri per questo campionato</div>`);
}
function draw(){sistema();header();const m=$("main");
  m.innerHTML=S.vista=="evidenza"?vEvidenza():S.vista=="partite"?vPartite():S.vista=="squadre"?vSquadre():vArbitri();
  const k=$("ordk"),d=$("ordd");if(k){const o=S.vista=="squadre"?S.ordS:S.ordA;k.onchange=()=>{o.k=k.value;salva();draw()};d.onclick=()=>{o.d=-o.d;salva();draw()}}}
function apri(li,pi){const L=D.leghe[li],B=bloccoDi(L),p=B.partite[pi];
  const amm=ammessi(L);
  let righe=TIPI.filter(([k])=>amm.includes(k)).map(([k,l])=>{const r=p[k],re=p.reale&&p.reale[k];if(!r)return"";const d=re?re.tot-r.totale:null;
    return `<tr${k==S.tipo?' style="background:var(--card2)"':""}><td><b>${l}</b></td><td class="num">${f(r.att_casa)}</td><td class="num">${f(r.att_osp)}</td><td class="num"><b>${f(r.totale)}</b></td>
      <td class="grp num">${re?re.casa:"–"}</td><td class="num">${re?re.osp:"–"}</td><td class="num"><b>${re?re.tot:"–"}</b></td><td class="d ${d==null?"":d>=0?"su":"giu"}">${d==null?"–":(d>=0?"+":"")+f(d)}</td></tr>`}).join("");
  let medie=TIPI.filter(([k])=>amm.includes(k)).map(([k,l])=>{const r=p[k];if(!r)return"";const[fa,su]=PAROLE[k];
    return `<tr><td><b>${l}</b></td><td class="num">${f(r.casa_fatti)}</td><td class="num">${f(r.casa_subiti)}</td><td class="grp num">${f(r.osp_trasf_fatti)}</td><td class="num">${f(r.osp_trasf_subiti)}</td></tr>`}).join("");
  const r0=p[amm[0]]||{};
  const arb=p.arbitro?`<p style="margin:6px 0 0"><b>${esc(p.arbitro.nome)}</b>${p.arbitro.var?" · VAR: "+esc(p.arbitro.var):""}${p.arbitro.n?` · in stagione <b>${f(p.arbitro.falli)}</b> falli e <b>${f(p.arbitro.cart)}</b> cartellini a partita (${p.arbitro.n} partite)`:""}</p>`:
    p.arbitro===null?`<p style="margin:6px 0 0;color:var(--mute)">Non ancora designato</p>`:`<p style="margin:6px 0 0;color:var(--mute)">Non disponibile per questo campionato</p>`;
  $("sheet").innerHTML=`<div class="sh-top"><div class="meta" style="margin:0"><span class="badge lg">${L.logo?`<img src="${esc(L.logo)}" alt="" onerror="this.remove()">`:""}${esc(L.nome)}</span><span>${esc(B.titolo)} · ${esc(p.data)} · ${esc(p.ora||"ora da confermare")}</span></div><button class="x" id="chiudi" aria-label="Chiudi">✕</button></div>
    <div class="vs"><div class="t">${logo(L,p.casa)}<b>${esc(p.casa)}</b></div><div class="score big">${p.giocata?esc(p.risultato):"vs"}</div><div class="t">${logo(L,p.osp)}<b>${esc(p.osp)}</b></div></div>
    <h3>Attese e reali</h3><div class="card scroll"><table><tr><th>Statistica</th><th>Casa</th><th>Osp.</th><th>Totale</th><th class="grp">Reale casa</th><th>Reale osp.</th><th>Reale tot.</th><th>Scarto</th></tr>${righe}</table></div>
    <h3>Medie usate (prima della giornata)</h3><div class="card scroll"><table><tr><th>Statistica</th><th>${esc(p.casa)}: fatti in casa</th><th>${esc(p.casa)}: subiti in casa</th><th class="grp">${esc(p.osp)}: fatti in trasf.</th><th>${esc(p.osp)}: subiti in trasf.</th></tr>${medie}</table></div>
    <div class="note">Partite usate: ${esc(p.casa)} ${r0.n_casa??"–"} in casa · ${esc(p.osp)} ${r0.n_osp??"–"} in trasferta. Per falli “subiti” = commessi dagli avversari; per cartellini e fuorigioco “subiti” = presi/fatti dagli avversari.</div>
    <h3>Arbitro</h3>${arb}`;
  $("ovl").classList.add("on");$("chiudi").onclick=chiudi;
}
const chiudi=()=>$("ovl").classList.remove("on");
$("ovl").onclick=e=>{if(e.target.id=="ovl")chiudi()};
document.addEventListener("keydown",e=>{if(e.key=="Escape")chiudi()});
$("vista").onclick=e=>{const b=e.target.closest("button");if(b){S.vista=b.dataset.v;salva();draw()}};
$("leghe").onclick=e=>{const b=e.target.closest("button");if(b){S.lega=+b.dataset.i;salva();draw()}};
$("tipo").onclick=e=>{const b=e.target.closest("button");if(b){S.tipo=b.dataset.t;salva();draw()}};
$("q").oninput=e=>{S.q=e.target.value.trim();if(S.q&&S.vista=="evidenza")S.vista="partite";draw()};
$("main").onclick=e=>{const th=e.target.closest("th[data-k]");
  if(th){const o=S.vista=="squadre"?S.ordS:S.ordA;if(o.k==th.dataset.k)o.d=-o.d;else{o.k=th.dataset.k;o.d=-1}salva();draw();return}
  const c=e.target.closest(".mc");if(c)apri(+c.dataset.l,+c.dataset.p)};
draw();
</script></body></html>
