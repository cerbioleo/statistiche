async function apri(pw){
  const s=crypto.subtle;
  const base=await s.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const k=new Uint8Array(await s.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:bin(C.sale),iterations:C.giri},base,512));
  const kc=await s.importKey("raw",k.slice(0,32),"AES-CTR",false,["decrypt"]);
  const km=await s.importKey("raw",k.slice(32),{name:"HMAC",hash:"SHA-256"},false,["verify"]);
  const cont=bin(C.contatore),dati=bin(C.dati),tutto=new Uint8Array(cont.length+dati.length);
  tutto.set(cont);tutto.set(dati,cont.length);
  if(!await s.verify("HMAC",km,bin(C.firma),tutto))return null;
  const z=await s.decrypt({name:"AES-CTR",counter:cont,length:64},kc,dati);
  return await new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
}
function mostra(html){document.open();document.write(html);document.close()}
function modulo(msg){$("f").hidden=false;$("m").textContent=msg||"";$("b").disabled=false;$("b").textContent="Apri";$("p").focus()}
(async()=>{
  if(!(window.crypto&&crypto.subtle&&window.DecompressionStream)){modulo("Questo browser è troppo vecchio: aggiorna iOS/Safari o usa un browser recente.");$("b").disabled=true;return}
  const salvata=ls.get(CHIAVE_PW);
  if(salvata){try{const h=await apri(salvata);if(h)return mostra(h)}catch(e){}ls.del(CHIAVE_PW);modulo("La password è cambiata: scrivi quella nuova.");return}
  modulo();
})();
$("f").addEventListener("submit",async e=>{
  e.preventDefault();const pw=$("p").value;if(!pw)return;
  $("b").disabled=true;$("b").textContent="Apertura…";$("m").textContent="";
  try{const h=await apri(pw);if(h){ls.set(CHIAVE_PW,pw);return mostra(h)}modulo("Password sbagliata.")}
  catch(err){modulo("Errore nell'apertura: "+err.message)}
});
})();
